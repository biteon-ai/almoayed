  - id: FIX-AUTH-001
    name: Demo Login Profile Fetch Fix & Auto-Upsert
    status: implemented
    persona: [DEVELOPER, ADMIN]
    routes: ["/login"]
    files:
      - src/lib/demo-accounts.ts
      - src/lib/supabase/admin.ts
      - src/lib/auth-session.ts
      - src/actions/login.ts
      - src/actions/auth.ts
      - src/app/login/login-form.tsx
      - tests/features/fix-auth-001-demo-login.test.ts
    acceptance:
      - Demo login uses Supabase Admin (service_role) client; never ambiguous profiles→student_teachers embed
      - Missing demo profiles (963912345678 / 963987654321) are auto-upserted with seed UUIDs + active student_teachers link
      - Supabase fetch/upsert errors and aborted timeouts map to LoginState errors (no unhandled throws)
      - Admin client fetch timeout 8s to avoid hung demo login
      - Placeholder host example.supabase.co does not create a live admin client (CI fail-fast; no DNS hang on /login)
      - Demo buttons show instant spinner + disabled state via useTransition (AUTH-006)
      - Success redirects to /dashboard (student) or /teacher/dashboard (teacher) with iron-session
      - When AUTH_DEMO_BYPASS is on, AUTH-003 device lock is skipped for demo WhatsApps (parallel e2e / multi-tab)
      - RTL error alerts unchanged
    spekit: [login-demo-student, login-demo-teacher, login-loading]

  - id: AUTH-007
    name: Block Inactive Account Login
    status: implemented
    persona: [STUDENT, TEACHER]
    routes: ["/login", "/api/auth/biteonswitch/callback"]
    aliases: [FIX-AUTH-002]
    extends: [AUTH-001, AUTH-003, AUTH-004, AUTH-005, MT-001, MT-002, ADMIN-001]
    files:
      - src/lib/account-access.ts
      - src/lib/auth-error-codes.ts
      - src/lib/login-ui-messages.ts
      - src/lib/auth-session.ts
      - src/lib/auth.ts
      - src/app/api/auth/biteonswitch/callback/route.ts
      - src/actions/auth.ts
      - src/actions/login.ts
      - src/app/login/login-form.tsx
      - tests/features/auth-007-inactive-login.test.ts
    acceptance:
      - Inactive teachers (teacher_account_status=inactive) cannot mint a session via WhatsApp OTP, email, emergency fallback, or demo
      - Students with zero active links and ≥1 deactivated link cannot mint a session; pending-only AUTH-002 limited session preserved
      - Refused login does not update profiles.last_session_id
      - Mid-session: inactive teacher or fully deactivated student → redirect /login?error=account_inactive with Arabic copy
      - Mid-session multi-teacher: current link deactivated but another active remains → re-scope currentTeacherId (no logout)
      - Canonical Arabic: «عذراً، هذا الحساب غير فعال. يرجى التواصل مع الإدارة»
      - Vitest describe [AUTH-007]; no Supabase inactive checks in middleware (PERF-001)
    notes: |
      FIX-AUTH-002 alias for closing prior gaps (email already checked inactive; OTP/demo/emergency did not).
    spekit: [login-form]

