# Al-Moayed (المؤيد) — Feature Specification Registry
# Source of truth for implemented capabilities. Update when behavior changes.

product:
  name: المؤيد
  name_en: Al-Moayed
  slogan: حلّ بإيدك، ما حدا بيفيدك.
  locale: ar-SY
  direction: rtl
  stack: Next.js 14 · Supabase · iron-session · Tailwind · Shadcn
  origins:
    production: https://almoayed.app
    production_www: https://www.almoayed.app
    development: https://dev.almoayed.app
    local: http://localhost:3000

status_legend:
  implemented: Shipped and in production codebase
  partial: Backend or actions exist; UI incomplete
  pending: Not started

# ─────────────────────────────────────────────────────────────────────────────
features:
  # ── Authentication ──────────────────────────────────────────────────────────
  - id: AUTH-001
    name: BiteonSwitch WhatsApp OTP Login
    status: implemented
    persona: [STUDENT, TEACHER]
    routes: ["/login", "/api/auth/biteonswitch/callback"]
    files:
      - src/app/login/login-form.tsx
      - src/actions/biteonswitch.ts
      - src/app/api/auth/biteonswitch/callback/route.ts
      - src/lib/biteonswitch/client.ts
      - src/lib/auth-session.ts
      - src/lib/session.ts
    acceptance:
      - /login uses compact top tabs: تسجيل جديد | دخول | تجربة (demo tab only when AUTH_DEMO_BYPASS enabled)
      - Existing users start BiteonSwitch hosted WhatsApp OTP from دخول tab
      - Callback verifies token server-side, enforces AUTH-003, mints iron-session
      - Students with no teacher link are prompted for رمز الأستاذ before session completes
      - Role redirect to /dashboard or /teacher/dashboard
      - Provider outage shows Arabic retry; no student emergency secret
      - Demo one-click login on تجربة tab when AUTH_DEMO_BYPASS enabled; tab hidden when disabled
      - No admin/emergency links on public /login (AUTH-005 is unlinked at /admin/emergency only)
    spekit: [login-form, login-whatsapp-field, login-otp-cta, login-submit]

