clarifications:
  - session: "2026-07-12"
    scope: TEACH-003 + TEACH-004 quiz-create bulk-import flow
    items:
      - q: After step 1 creates the quiz, what happens if the teacher refreshes during bulk-import setup?
        a: Redirect to /teacher/quizzes/[id] with bulk upload inline (single durable URL); ?setup=import resumes post-create setup
      - q: If a teacher uploads a second file on a quiz that already has questions, should rows append or be blocked?
        a: Always append imported rows; no duplicate detection in v1
      - q: Can a quiz with zero questions be marked active (visible to students)?
        a: Force inactive until at least one question exists; teacher toggles active from quiz list after
      - q: After successful bulk import during setup, should the UI nudge the teacher to activate the quiz?
        a: No activation nudge; teacher activates from quiz list when ready

