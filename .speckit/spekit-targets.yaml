# Spekit DOM targeting registry — Al-Moayed (المؤيد)
# Selector: [data-spekit="<id>"]
# Source of truth: src/lib/spekit-targets.ts

meta:
  app: Al-Moayed
  language: ar
  direction: rtl
  total_targets: 70

# ── Core Spots (priority — wire these first in Spekit) ───────────
core_spots:
  - feature: AUTH-001/002
    selector: '[data-spekit="login-form"]'
    file: src/app/login/login-form.tsx

  - feature: MT-002
    selector: '[data-spekit="teacher-switcher"]'
    file: src/components/dashboard/TeacherSwitcher.tsx

  - feature: QUIZ-001
    selector: '[data-spekit="quiz-gatekeeper"]'
    file: src/components/quiz/QuizRunner.tsx

  - feature: QUIZ-002
    selector: '[data-spekit="weak-points-card"]'
    file: src/components/dashboard/WeakPointsCard.tsx

  - feature: TIER-001
    selector: '[data-spekit="pro-upgrade-card"]'
    file: src/components/dashboard/ProUpgradeCard.tsx

  - feature: TIER-002
    selector: '[data-spekit="pro-approval-panel"]'
    file: src/components/teacher/StudentManagement.tsx

  - feature: TEACH-004
    selector: '[data-spekit="bulk-import-zone"]'
    file: src/components/teacher/FileUploadZone.tsx

